<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Task - Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <section id="addTaskPage" class="page">
    <h2>Add New Task</h2>

    <!-- READY FOR BACKEND -->
    <form id="taskForm" class="card" method="POST" action="/add-task">
      
      <label for="taskTitle">Task Title</label>
      <input type="text" id="taskTitle" name="title"
             placeholder="Enter task title" required>

      <label for="taskDescription">Description</label>
      <textarea id="taskDescription" name="description"
                rows="3" placeholder="Write task details"></textarea>

      <label for="dueDate">Due Date</label>
      <input type="date" id="dueDate" name="dueDate" required>

      <label for="priority">Priority</label>
      <select id="priority" name="priority" required>
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>

      <button class="btn-primary" type="submit">Save Task</button>

      <p class="form-text">
        View task list? <a href="tasks.html">Go to tasks</a>
      </p>

    </form>

  </section>

</div>

<script src="js/app.js"></script>
</body>
</html>
